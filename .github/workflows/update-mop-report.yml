name: Update MOP Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mop-report-pages
  cancel-in-progress: true

jobs:
  sync-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync MOP report
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          BITRIX_BOOKING_WEBHOOK_URL: ${{ secrets.BITRIX_BOOKING_WEBHOOK_URL }}
          BITRIX_REQUEST_TIMEOUT: ${{ secrets.BITRIX_REQUEST_TIMEOUT }}
          BITRIX_APPROVED_MORTGAGE_FIELD: ${{ secrets.BITRIX_APPROVED_MORTGAGE_FIELD }}
          BITRIX_STAGE_FIELD: ${{ secrets.BITRIX_STAGE_FIELD || 'STAGE_ID' }}
          BITRIX_SUCCESS_STAGE_IDS: ${{ secrets.BITRIX_SUCCESS_STAGE_IDS || 'WON,CLOSED' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_MEETING_LOG_SHEET_ID: 1CNT1xTe5uBHo4W4ZLUh3qZLmgWy7wxe7nSsCtDXwwIo
          GOOGLE_MEETING_LOG_SHEET_NAME: Meetings
          MOP_PLAN_SHEET_ID: ${{ secrets.MOP_PLAN_SHEET_ID }}
          MOP_PLAN_SHEET_NAME: ${{ secrets.MOP_PLAN_SHEET_NAME }}
          MOP_PLAN_SHEET_GID: ${{ secrets.MOP_PLAN_SHEET_GID }}
          MOP_PLAN_MONTH: ${{ secrets.MOP_PLAN_MONTH }}
          MOP_PLAN_REQUIRED: ${{ secrets.MOP_PLAN_REQUIRED }}
          MOP_DEAL_DATE_FIELD: ${{ secrets.MOP_DEAL_DATE_FIELD }}
          MOP_APPROVED_MORTGAGE_DATE_FIELD: ${{ secrets.MOP_APPROVED_MORTGAGE_DATE_FIELD }}
          MOP_ASSIGNED_FIELD: ASSIGNED_BY_ID
          MOP_UNKNOWN_USER: ${{ secrets.MOP_UNKNOWN_USER }}
          MOP_INCLUDE_USERS: Черткова Ирина,Газисова Мария,Попова Олеся,Попова Юлия,Губайдулина Заррина,Тончу Ростислав,Погребинский Артем,Камболин Александр,Жуков Лев,Гавриленко Елена
          MOP_EXCLUDE_USERS: ""
          MOP_CALL_MIN_DURATION_SECONDS: ${{ secrets.MOP_CALL_MIN_DURATION_SECONDS }}
          MOP_SKIP_BITRIX_CALLS: "true"
          REPORT_TIMEZONE: ${{ secrets.REPORT_TIMEZONE }}
          REPORT_PERIOD_MODE: ${{ secrets.REPORT_PERIOD_MODE }}
          REPORT_START_DATE: ${{ secrets.REPORT_START_DATE }}
        run: python scripts/sync_mop_report.py

      - name: Import VATS calls
        run: python scripts/import_vats_data.py

      - name: Apply shared plans
        run: python scripts/shared_plan_store.py apply

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-dashboard:
    needs: sync-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
