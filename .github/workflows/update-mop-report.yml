name: Update MOP Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mop-report-pages
  cancel-in-progress: true

jobs:
  sync-report:
    runs-on: ubuntu-latest
    env:
      MOP_CALL_SOURCE: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Open TempLab MongoDB tunnel through Timeweb
        id: mongo-tunnel
        continue-on-error: true
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_PORT: ${{ secrets.TIMEWEB_PORT }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          TIMEWEB_SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          TIMEWEB_KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TIMEWEB_SSH_PRIVATE_KEY" > "$HOME/.ssh/timeweb_mop_report"
          chmod 600 "$HOME/.ssh/timeweb_mop_report"
          printf '%s\n' "$TIMEWEB_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -f -N \
            -i "$HOME/.ssh/timeweb_mop_report" \
            -p "${TIMEWEB_PORT:-22}" \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 127.0.0.1:27018:94.198.221.153:27017 \
            "$TIMEWEB_USER@$TIMEWEB_HOST"
          echo "endpoint=127.0.0.1:27018" >> "$GITHUB_OUTPUT"

      - name: Sync MOP report
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          BITRIX_BOOKING_WEBHOOK_URL: ${{ secrets.BITRIX_BOOKING_WEBHOOK_URL }}
          BITRIX_REQUEST_TIMEOUT: ${{ secrets.BITRIX_REQUEST_TIMEOUT }}
          BITRIX_APPROVED_MORTGAGE_FIELD: ${{ secrets.BITRIX_APPROVED_MORTGAGE_FIELD }}
          BITRIX_STAGE_FIELD: ${{ secrets.BITRIX_STAGE_FIELD || 'STAGE_ID' }}
          BITRIX_SUCCESS_STAGE_IDS: ${{ secrets.BITRIX_SUCCESS_STAGE_IDS || 'WON,CLOSED' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_MEETING_LOG_SHEET_ID: 1CNT1xTe5uBHo4W4ZLUh3qZLmgWy7wxe7nSsCtDXwwIo
          GOOGLE_MEETING_LOG_SHEET_NAME: Meetings
          GOOGLE_TARGET_AFTER_MEETING_SHEET_ID: ${{ secrets.GOOGLE_TARGET_AFTER_MEETING_SHEET_ID || '1hvLyXXBQEwAeDFAKITr_lTE8pBHX8RLTy_S_0OECsjk' }}
          GOOGLE_TARGET_AFTER_MEETING_SHEET_NAME: ${{ secrets.GOOGLE_TARGET_AFTER_MEETING_SHEET_NAME }}
          GOOGLE_TARGET_AFTER_MEETING_SHEET_GID: ${{ secrets.GOOGLE_TARGET_AFTER_MEETING_SHEET_GID || '0' }}
          MOP_PLAN_SHEET_ID: 10X8fFIAjX2nSzOaqHE3QjMCRdU98a_2OIwzU03aC2Bo
          MOP_PLAN_SHEET_NAME: ${{ secrets.MOP_PLAN_SHEET_NAME }}
          MOP_PLAN_SHEET_GID: ${{ secrets.MOP_PLAN_SHEET_GID }}
          MOP_PLAN_MONTH: ${{ secrets.MOP_PLAN_MONTH }}
          MOP_PLAN_REQUIRED: ${{ secrets.MOP_PLAN_REQUIRED }}
          MOP_DEAL_DATE_FIELD: ${{ secrets.MOP_DEAL_DATE_FIELD }}
          MOP_APPROVED_MORTGAGE_DATE_FIELD: ${{ secrets.MOP_APPROVED_MORTGAGE_DATE_FIELD }}
          MOP_ASSIGNED_FIELD: ASSIGNED_BY_ID
          MOP_UNKNOWN_USER: ${{ secrets.MOP_UNKNOWN_USER }}
          MOP_INCLUDE_USERS: Черткова Ирина,Попова Олеся,Попова Юлия,Губайдулина Заррина,Тончу Ростислав,Погребинский Артем,Камболин Александр,Жуков Лев,Гавриленко Елена,Войнов Данил,Султанов Есен,Парфенов Владислав,Ядрышникова Кристина,Васильев Владимир,Марина Данчук
          MOP_EXCLUDE_USERS: ""
          MOP_CALL_MIN_DURATION_SECONDS: ${{ secrets.MOP_CALL_MIN_DURATION_SECONDS }}
          MONGO_CALLS_CONFIG_URI: ${{ secrets.MONGO_CALLS_CONFIG_URI }}
          MONGO_CALLS_CONFIG_DATABASE: mongo_calls
          MONGO_CALLS_CONFIG_COLLECTION: customers
          MONGO_CALLS_REQUIRE_SERVER_READ_ONLY: "false"
          MONGO_CALLS_REQUIRED: "false"
          MONGO_CALLS_FALLBACK_TO_BITRIX: "false"
          MONGO_CALLS_CONNECT_TIMEOUT_MS: "5000"
          MONGO_CALLS_ENDPOINT_OVERRIDE: ${{ steps.mongo-tunnel.outputs.endpoint }}
          MONGO_CALL_SCHEMA_DIAGNOSTICS: "true"
          REPORT_TIMEZONE: ${{ secrets.REPORT_TIMEZONE }}
          REPORT_PERIOD_MODE: ${{ secrets.REPORT_PERIOD_MODE }}
          REPORT_START_DATE: ${{ secrets.REPORT_START_DATE }}
        run: python scripts/sync_mop_report.py

      - name: Import VATS calls
        if: ${{ env.MOP_CALL_SOURCE != 'mongodb' }}
        run: python scripts/import_vats_data.py

      - name: Apply shared plans
        run: python scripts/shared_plan_store.py apply

      - name: Persist high priority history
        run: |
          git add manual-data/high-priority-history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update high priority history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build Timeweb deployment bundle
        run: |
          (cd dashboard && zip -qr ../mop-report.zip .)
          mv mop-report.zip dashboard/mop-report.zip

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-dashboard:
    needs: sync-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
