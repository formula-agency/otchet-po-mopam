name: Publish Shared MOP Plan

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: shared-mop-plan
  cancel-in-progress: false

jobs:
  publish-plan:
    if: >-
      startsWith(github.event.issue.title, '[План МОП]')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate and store plan
        run: python scripts/shared_plan_store.py publish-event "$GITHUB_EVENT_PATH"

      - name: Commit shared plan
        id: commit
        run: |
          if git diff --quiet -- manual-data/shared-plans.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual-data/shared-plans.json
          git commit -m "Update shared MOP plan"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild report
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/update-mop-report.yml/dispatches
          -f ref=main

      - name: Confirm publication
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'План принят. Отчет пересобирается и будет одинаковым для всех устройств.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Report publication failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'План не опубликован. Проверьте журнал GitHub Actions для этой задачи.'
            });
