name: Probe Timeweb TempLab access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Probe MongoDB connectivity from Timeweb
        env:
          TIMEWEB_FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          TIMEWEB_FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          TIMEWEB_FTP_DEPLOY_PATH: ${{ secrets.TIMEWEB_FTP_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          export PROBE_TOKEN="$(openssl rand -hex 24)"
          export PROBE_FILE="_templab_probe_${GITHUB_RUN_ID}.php"

          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ["PROBE_TOKEN"]
          source = """<?php
          header('Content-Type: application/json; charset=utf-8');
          if (!isset($_GET['token']) || !hash_equals('__TOKEN__', (string) $_GET['token'])) {
              http_response_code(404);
              exit;
          }

          $disabled = array_filter(array_map('trim', explode(',', (string) ini_get('disable_functions'))));
          $shellAvailable = function_exists('shell_exec') && !in_array('shell_exec', $disabled, true);
          $socketErrorNumber = 0;
          $socketErrorMessage = '';
          $startedAt = microtime(true);
          $socket = @fsockopen('94.198.221.153', 27017, $socketErrorNumber, $socketErrorMessage, 5);
          $socketConnected = is_resource($socket);
          if ($socketConnected) {
              fclose($socket);
          }

          $commands = [];
          if ($shellAvailable) {
              foreach (['mongosh', 'mongo', 'python3'] as $command) {
                  $result = trim((string) shell_exec('command -v ' . escapeshellarg($command) . ' 2>/dev/null'));
                  $commands[$command] = $result !== '';
              }
          }

          echo json_encode([
              'phpVersion' => PHP_VERSION,
              'mongodbExtension' => extension_loaded('mongodb'),
              'mongoClientClass' => class_exists('MongoDB\\Client'),
              'fsockopenAvailable' => function_exists('fsockopen'),
              'mongoSocketConnected' => $socketConnected,
              'mongoSocketErrorNumber' => $socketErrorNumber,
              'mongoSocketErrorMessage' => $socketErrorMessage,
              'mongoSocketElapsedMs' => (int) round((microtime(true) - $startedAt) * 1000),
              'shellAvailable' => $shellAvailable,
              'commands' => $commands,
          ], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
          """.replace('__TOKEN__', token)
          Path(os.environ['PROBE_FILE']).write_text(source, encoding='utf-8')
          PY

          cleanup() {
            python3 - <<'PY' >/dev/null 2>&1 || true
          import ftplib
          import os
          import ssl

          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20)
          ftp.connect(os.environ['TIMEWEB_FTP_HOST'], 21)
          ftp.login(os.environ['TIMEWEB_FTP_USER'], os.environ['TIMEWEB_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(os.environ['TIMEWEB_FTP_DEPLOY_PATH'])
          try:
              ftp.delete(os.environ['PROBE_FILE'])
          except ftplib.error_perm:
              pass
          ftp.quit()
          PY
            rm -f "$PROBE_FILE"
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import ftplib
          import os
          import ssl

          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20)
          ftp.connect(os.environ['TIMEWEB_FTP_HOST'], 21)
          ftp.login(os.environ['TIMEWEB_FTP_USER'], os.environ['TIMEWEB_FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(os.environ['TIMEWEB_FTP_DEPLOY_PATH'])
          with open(os.environ['PROBE_FILE'], 'rb') as source:
              ftp.storbinary('STOR ' + os.environ['PROBE_FILE'], source)
          ftp.quit()
          PY

          curl --fail --silent --show-error \
            "http://projects.formula-agency.ru/mop-report/$PROBE_FILE?token=$PROBE_TOKEN"
