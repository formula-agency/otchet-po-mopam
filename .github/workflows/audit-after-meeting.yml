name: Audit After-Meeting Airtime

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Open TempLab tunnel
        env:
          MONGO_SSH_PRIVATE_KEY: ${{ secrets.MONGO_SSH_PRIVATE_KEY }}
          MONGO_SSH_KNOWN_HOSTS: ${{ secrets.MONGO_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$MONGO_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/formula_templab_bastion"
          printf '%s\n' "$MONGO_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/formula_templab_bastion" "$HOME/.ssh/known_hosts"
          ssh -f -N -i "$HOME/.ssh/formula_templab_bastion" -o BatchMode=yes -o ExitOnForwardFailure=yes -o IdentitiesOnly=yes -L 127.0.0.1:27019:89.223.71.184:27017 root@45.91.238.53
      - name: Compare source rows
        env:
          MONGO_CALLS_TENANT_URI: ${{ secrets.MONGO_CALLS_TENANT_URI }}
          MONGO_CALLS_TENANT_DATABASE: ${{ secrets.MONGO_CALLS_TENANT_DATABASE || 'mongo_calls' }}
          MONGO_CALLS_TENANT_ENDPOINT_OVERRIDE: 127.0.0.1:27019
        run: python scripts/audit_after_meeting_snapshot.py
